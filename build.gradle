plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.coma'
version = '0.0.1-SNAPSHOT'
description = 'Coma room backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
// 1. Web & 핵심 (ObjectMapper 자동 생성을 위해 필수)
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 2. Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 3. Database (요청하신 대로 유지)
	runtimeOnly 'com.mysql:mysql-connector-j'
//	runtimeOnly 'org.postgresql:postgresql'

	// 4. JWT & Jackson (JJWT와 Jackson의 버전 정합성 유지)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// 5. Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// 6. OAuth2
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// 스터디 자료: Oracle Cloud Object Storage
	implementation platform('com.oracle.oci.sdk:oci-java-sdk-bom:3.92.1')
	implementation 'com.oracle.oci.sdk:oci-java-sdk-objectstorage'
	implementation 'com.oracle.oci.sdk:oci-java-sdk-common-httpclient-jersey3'
}


tasks.named('test') {
	useJUnitPlatform()
}
